<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zone Scout</title>
<meta name="theme-color" content="#3E8E4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zone Scout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F0F7EC; --dot:#D9EBD2; --surface:#FFFFFF; --sunk:#E3F0DE; --ink:#1E3A25; --muted:#5B7A60; --line:#D2E6CB;
  --green:#3E8E4D; --green-ink:#FFFFFF; --leaf-soft:#D5EFCB;
  --purple:#8E6CCB; --purple-soft:#EEE6FB; --pink:#F08FAF; --pink-soft:#FDE6EE;
  --sticky:#FFD94F; --sticky-ink:#3A2F00;
  --h0:#E6F1E1; --h1:#FFF0A6; --h2:#FFC96B; --h3:#F48C5E; --h4:#DE5470;
  --h0-ink:#5B7A60; --h1-ink:#4A3D00; --h2-ink:#4A2E00; --h3-ink:#FFFFFF; --h4-ink:#FFFFFF;
  --ok:#3E8E4D; --warn:#D07A1C; --bad:#C9435E;
  --shadow:0 2px 0 rgba(46,95,55,.08),0 6px 18px rgba(46,95,55,.07);
  --display:"Fredoka","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111A13; --dot:#1B281E; --surface:#19251C; --sunk:#213024; --ink:#E5F2E3; --muted:#9BB99F; --line:#2C4231;
    --green:#7FD28C; --green-ink:#0D1F11; --leaf-soft:#223A28;
    --purple:#B89CF0; --purple-soft:#2B2340; --pink:#F4A3BF; --pink-soft:#3A2230;
    --sticky:#F2CD41; --sticky-ink:#241C00;
    --h0:#1F2F23; --h1:#57502A; --h2:#8A6426; --h3:#A6512F; --h4:#B23B55;
    --h0-ink:#9BB99F; --h1-ink:#F7EDBC; --h2-ink:#FFF1D2; --h3-ink:#FFFFFF; --h4-ink:#FFFFFF;
    --ok:#7FD28C; --warn:#EFA84A; --bad:#F27D95;
    --shadow:0 2px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111A13; --dot:#1B281E; --surface:#19251C; --sunk:#213024; --ink:#E5F2E3; --muted:#9BB99F; --line:#2C4231;
  --green:#7FD28C; --green-ink:#0D1F11; --leaf-soft:#223A28;
  --purple:#B89CF0; --purple-soft:#2B2340; --pink:#F4A3BF; --pink-soft:#3A2230;
  --sticky:#F2CD41; --sticky-ink:#241C00;
  --h0:#1F2F23; --h1:#57502A; --h2:#8A6426; --h3:#A6512F; --h4:#B23B55;
  --h0-ink:#9BB99F; --h1-ink:#F7EDBC; --h2-ink:#FFF1D2; --h3-ink:#FFFFFF; --h4-ink:#FFFFFF;
  --ok:#7FD28C; --warn:#EFA84A; --bad:#F27D95;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px dashed var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:60px}
.leaf{display:inline-block;color:var(--green);flex:none}
.brand{font-family:var(--display);font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.brand .leaf{width:34px;height:30px;transform:rotate(-8deg)}
.brand em{font-style:normal;color:var(--purple)}
.crumb{font-family:var(--display);font-weight:600;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--ok)} .sync.busy b{background:var(--warn)} .sync.err b{background:var(--bad)}
h2{font-family:var(--display);font-weight:600;font-size:17px;color:var(--green);margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2 .leaf{width:18px;height:16px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;margin:22px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .08s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:17px}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green);box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn.sticky{background:var(--sticky);color:var(--sticky-ink);border-color:var(--sticky)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%}
.btn .leaf{width:20px;height:18px}
.btn[disabled]{opacity:.45;cursor:default}
.linkish{border:0;background:none;padding:0;color:var(--purple);font-weight:700;text-decoration:underline}
.back{min-height:42px;min-width:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:130px}
.field label{font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{min-height:50px;border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:0 14px;width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:5px;border-radius:20px}
.areas button{min-height:60px;border:0;border-radius:16px;background:transparent;font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.areas button small{font-family:var(--body);font-weight:400;font-size:12px}
.areas button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.areas button.on[data-k="flower"]{color:var(--purple)}
.areas button.on[data-k="veg"]{color:var(--green)}
.areas button.on[data-k="mother"]{color:var(--pink)}
.area-hd{font-family:var(--display);font-weight:600;font-size:19px;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.area-hd::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--area,var(--green))}
.area-hd::after{content:"";flex:1;border-top:2px dashed var(--line)}
.area-hd.flower{--area:var(--purple)} .area-hd.veg{--area:var(--green)} .area-hd.mother{--area:var(--pink)}
.walk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
.walk .z{font-family:var(--display);font-weight:700;font-size:20px;min-width:62px;grid-row:span 2;background:var(--leaf-soft);color:var(--green);border-radius:14px;padding:10px 8px;text-align:center}
.walk .d{font-weight:700}
.walk .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.walk .pct{font-family:var(--mono);font-size:14px;grid-row:span 2;color:var(--purple)}
.bar{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:10px;border:2px solid var(--line)}
.bar span{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--green) 0 8px,color-mix(in srgb,var(--green) 80%,#fff) 8px 16px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.stat:nth-child(1){background:var(--leaf-soft)} .stat:nth-child(2){background:color-mix(in srgb,var(--sticky) 28%,var(--surface))} .stat:nth-child(3){background:var(--pink-soft)}
.stat .n{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--display);font-size:13px;font-weight:500;color:var(--muted)}
.grid-wrap{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.heat{display:grid;grid-template-columns:36px repeat(5,minmax(46px,1fr));gap:6px;min-width:290px}
.heat .hd{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);text-align:center;align-self:end}
.heat .rh{font-family:var(--display);font-weight:700;font-size:17px;align-self:center;color:var(--green)}
.cell{aspect-ratio:1/1;max-width:100%;border-radius:14px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.cell .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;line-height:1}
.cell .pd{display:flex;gap:2px}
.cell .pd i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25}
.cell .pd i.on{opacity:1}
.cell .pb{display:block;width:30px;height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden}
.cell .pb b{display:block;height:100%;background:currentColor;border-radius:3px}
.cell.todo{border-style:dashed;border-color:var(--muted)}
.l0{background:var(--h0);color:var(--h0-ink)} .l1{background:var(--h1);color:var(--h1-ink)} .l2{background:var(--h2);color:var(--h2-ink)} .l3{background:var(--h3);color:var(--h3-ink)} .l4{background:var(--h4);color:var(--h4-ink)}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;text-align:left;width:100%}
.flag .loc{font-family:var(--mono);font-size:13px;color:var(--purple);min-width:82px}
.flag .what{flex:1}
.flag.stack{flex-direction:column;align-items:flex-start;gap:6px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.card-tag{display:inline-flex;align-items:center;gap:6px;background:var(--sticky);color:var(--sticky-ink);font-family:var(--display);font-weight:600;padding:6px 14px;border-radius:6px 6px 14px 6px;font-size:16px;transform:rotate(-2deg);box-shadow:0 3px 8px rgba(120,100,0,.18)}
.counts{display:flex;flex-direction:column}
.count{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.count:last-child{border-bottom:0}
.count .nm{font-weight:700}
.count .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--leaf-soft);color:var(--green);font-size:24px;font-weight:700;line-height:1}
.stepper input{width:64px;height:48px;text-align:center;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.plant{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.plant.clean{border-color:var(--ok);background:color-mix(in srgb,var(--leaf-soft) 55%,var(--surface))}
.plant.issue{border-color:var(--warn)}
.plant-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plant-head .pn{font-family:var(--display);font-weight:700;font-size:21px;min-width:80px;display:flex;align-items:center;gap:6px}
.plant-head .pn .leaf{width:22px;height:20px}
.plant.issue .pn .leaf{color:var(--warn)}
.plant:not(.clean):not(.issue) .pn .leaf{color:var(--muted);opacity:.5}
.plant-head .st{font-size:13px;color:var(--muted);flex:1;min-width:90px}
.plant-head .btn{min-height:44px;padding:0 16px;font-size:16px}
.plant-head .btn.on{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.plant-head .btn.warn.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.grp{font-family:var(--display);font-weight:600;font-size:15px;color:var(--purple);margin-top:6px}
.item{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.item .nm{font-weight:700;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;padding:2px}
.seg button .k{display:block;font-family:var(--mono);font-size:16px}
.seg button.sel.s0{background:var(--h0);color:var(--ink);border-color:var(--muted)}
.seg button.sel.s1{background:var(--h1);color:var(--h1-ink);border-color:var(--h1)}
.seg button.sel.s2{background:var(--h2);color:var(--h2-ink);border-color:var(--h2)}
.seg button.sel.s3{background:var(--h3);color:var(--h3-ink);border-color:var(--h3)}
.seg button.sel.s4{background:var(--h4);color:var(--h4-ink);border-color:var(--h4)}
textarea{width:100%;min-height:64px;border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:10px 14px;resize:vertical}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:22px}
.note{font-size:13px;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:10px;border:2px solid var(--bad);border-radius:20px;padding:16px;margin-top:10px;background:var(--pink-soft)}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.spark{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.spark .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.spark .t span{font-family:var(--mono);font-weight:500;color:var(--purple)}
.spark svg{display:block;width:100%;height:44px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:var(--green-ink);font-family:var(--display);font-weight:500;padding:12px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);z-index:10;box-shadow:var(--shadow)}
.empty{border:2px dashed var(--line);border-radius:22px;padding:20px;color:var(--muted);background:var(--surface);display:flex;gap:14px;align-items:center}
.empty .leaf{width:44px;height:40px;opacity:.7}
.strain-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.strain{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);width:100%}
.strain .sw,.strain-hero .sw{grid-row:span 3;width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--hue) 20%,var(--surface));color:var(--hue)}
.strain .sw .leaf{width:32px;height:30px;color:inherit}
.strain .sn{font-family:var(--display);font-weight:700;font-size:20px}
.strain .sl{font-size:13px;color:var(--muted)}
.strain .sm{font-size:12px;color:var(--purple)}
.strain-hero{display:flex;gap:14px;align-items:center;margin-top:20px}
.strain-hero .sw{width:64px;height:64px;border-radius:22px;flex:none}
.strain-hero .sw .leaf{width:40px;height:36px;color:inherit}
.terps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.terps span{background:var(--purple-soft);color:var(--purple);font-family:var(--display);font-weight:600;font-size:14px;padding:5px 12px;border-radius:999px}
.facts{display:grid;gap:10px}
.facts div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding-bottom:10px;border-bottom:2px dashed var(--line)}
.facts div:last-child{border-bottom:0;padding-bottom:0}
.facts dt{font-family:var(--display);font-weight:600;color:var(--muted);font-size:14px}
.facts dd{margin:0}
.grow{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.grow li::marker{color:var(--green)}
.src a{color:var(--purple)}
.zone-map{display:grid;gap:8px;padding:12px 14px}
.zrow{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center}
.zrow label{font-family:var(--display);font-weight:600}
.zrow select,.strain-pick select{min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:0 12px;width:100%}
.strain-pick{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:14px}
.strain-pick label{font-family:var(--display);font-weight:600;color:var(--muted)}
.watch{margin-top:10px;background:var(--pink-soft);border:2px solid color-mix(in srgb,var(--pink) 50%,var(--line));border-radius:18px;padding:12px 14px;font-size:14px}
.watch b{font-family:var(--display);font-weight:600;color:var(--bad)}
.home-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.info{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--purple-soft);color:var(--purple);font-family:var(--display);font-weight:700;font-size:14px;line-height:1;margin-left:6px;vertical-align:middle;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chips button{min-height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.chips button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.pest{display:grid;grid-template-columns:68px 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
.pest .thumb{grid-column:1;grid-row:1/4;width:68px;height:52px;background:var(--sunk);border-radius:14px;padding:2px;display:flex;align-items:center}
.pest .kind{grid-column:3;grid-row:1;justify-self:end}
.pest .pn2{grid-column:2;grid-row:1;font-family:var(--display);font-weight:700;font-size:19px}
.pest .ps{grid-column:2/-1;font-size:13px;color:var(--muted);font-style:italic}
.pest .pw{grid-column:2/-1;font-size:12px;color:var(--purple)}

<script>
(function(){
const HOUSES=5, CARDS=5;
const HOUSES_BY_AREA={flower:5,veg:5,mother:3};
function housesFor(z){return HOUSES_BY_AREA[areaOf(z).k]||HOUSES}
function cardsTotal(z){return housesFor(z)*CARDS}
function curHouses(){const w=walks[state.walkId];return w?housesFor(w.zone):HOUSES}
function sprayHouses(d){return d.zones&&d.zones.length?Math.max(...d.zones.map(housesFor)):HOUSES}
const PLANTS_BY_AREA={flower:5,veg:15,mother:10};
function plantsFor(z){return PLANTS_BY_AREA[areaOf(z).k]||5}
function curPlants(){const w=walks[state.walkId];return w?plantsFor(w.zone):5}
function zoneTotal(z){return housesFor(z)*CARDS*plantsFor(z)}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const AREAS=[
  {k:'flower',n:'Flower',zones:range(101,114)},
  {k:'veg',n:'Veg',zones:[16,18,19]},
  {k:'mother',n:'Mothers',zones:[15,17]}
];
const ZONES=AREAS.flatMap(a=>a.zones);
const ZONE_MIN=101;
function areaOf(z){return AREAS.find(a=>a.zones.includes(+z))||{k:'other',n:'Other',zones:[]}}
function zoneOpts(sel){return AREAS.map(a=>'<optgroup label="'+a.n+'">'+a.zones.map(z=>'<option value="'+z+'"'+(z===sel?' selected':'')+'>Zone '+z+'</option>').join('')+'</optgroup>').join('')}
const CARD_ITEMS=[
  {k:'thr',n:'Thrips'},
  {k:'wf',n:'Whiteflies'},
  {k:'fg',n:'Fungus gnats'},
  {k:'sf',n:'Shore flies'},
  {k:'lm',n:'Leaf miner adults'},
  {k:'wa',n:'Winged aphids',h:'Root or foliar; confirm on plants'}
];
const PLANT_GROUPS=[
  {label:'Foliage pests',items:[
    {k:'faph',n:'Foliar aphids'},
    {k:'tssm',n:'Two-spotted spider mites'},
    {k:'thr',n:'Thrips larvae or feeding damage'},
    {k:'wf',n:'Whitefly nymphs'},
    {k:'lm',n:'Leaf miner trails'}]},
  {label:'Disease',items:[
    {k:'bot',n:'Botrytis'},
    {k:'pm',n:'Powdery mildew'},
    {k:'dm',n:'Downy mildew'}]},
  {label:'Roots (lift the wrap)',items:[
    {k:'raph',n:'Root aphids'},
    {k:'rrot',n:'Root rot'}]}
];
const PLANT_ITEMS=PLANT_GROUPS.flatMap(g=>g.items);
function leafSvg(cls){const L=[[0,1],[30,.84],[-30,.84],[60,.66],[-60,.66],[100,.38],[-100,.38]];const p=L.map(([a,k])=>{const l=44*k,w=10*k;return '<path transform="rotate('+a+')" d="M0,0 Q'+w+','+(-l*.55)+' 0,'+(-l)+' Q'+(-w)+','+(-l*.55)+' 0,0Z"/>'}).join('');return '<svg class="leaf'+(cls?' '+cls:'')+'" viewBox="-34 -46 68 62" fill="currentColor" aria-hidden="true"><g transform="translate(0,6)">'+p+'<path d="M0,0 L0,11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/></g></svg>'}
const SEV=['None','Trace','Scattered','Widespread','Heavy'];
const LS_KEY='zonescout.v1';
const STRAINS=[
 {k:'space-cake',n:'Space Cake',type:'Indica-dominant hybrid, about 65/35',lineage:'GSC Forum Cut × Snow Lotus',breeder:'Bodhi Seeds',flower:'8–9 weeks indoors',thc:'20–25%',terps:['Caryophyllene','Limonene','Myrcene'],
  grow:['Stretches about 50–80% after the flip','Compact, spear-shaped colas with heavy resin','Moderate feeder; responds to phosphorus and potassium in bloom'],
  watch:[{i:'bot',t:'Dense colas. The source advises RH under 45% in late flower and defoliating to keep moisture out of the buds.'}],
  src:[['Strainpedia: Space Cake','https://www.strainpedia.com/space-cake/']]},
 {k:'og-kush',n:'OG Kush',type:'Hybrid; phenotypes range from sativa- to indica-leaning',lineage:'Disputed. Commonly traced to Chemdawg, Lemon Thai and Hindu Kush',breeder:'Unknown; emerged in Florida in the early 1990s',flower:'About 56 days (7–9 weeks)',thc:'Not listed',terps:['Myrcene','Limonene','Caryophyllene'],
  grow:['Rated difficult','Buds get heavy and dense; needs support','Prefers dry conditions','Several phenotypes with different structure'],
  watch:[{i:'pm',t:'Listed as susceptible to powdery mildew. Pruning for airflow is the advised control.'},{i:'bot',t:'Prone to bud rot when humidity runs high in flower.'}],
  src:[['Leafly: OG Kush','https://www.leafly.com/strains/og-kush'],['Leafly: Tips for growing OG Kush','https://www.leafly.com/news/growing/how-to-grow-og-kush-marijuana']]},
 {k:'gmo',n:'GMO',aka:'GMO Cookies, Garlic Cookies',type:'Indica-dominant hybrid',lineage:'Girl Scout Cookies × Chemdawg',breeder:'Mamiko Seeds',flower:'8–9 weeks (listing)',thc:'About 28% (listing)',terps:['Caryophyllene','Limonene','Myrcene'],
  grow:['Rated hard to grow','Short to medium height','Medium yield','Chemical, peppery, pungent aroma'],
  watch:[],
  src:[['Leafly: GMO Cookies','https://www.leafly.com/strains/gmo-cookies']]},
 {k:'wedding-cake',n:'Wedding Cake',aka:'Pink Cookies in Canada',type:'Indica-leaning hybrid',lineage:'Triangle Kush × Animal Mints',breeder:'Not listed in source',flower:'7–9 weeks',thc:'About 24% (listing)',terps:['Caryophyllene','Limonene','Myrcene'],
  grow:['Intermediate to advanced difficulty','Average yield'],
  watch:[],
  src:[['Leafly: Wedding Cake','https://www.leafly.com/strains/wedding-cake']]},
 {k:'sonic-lemon-fuel',n:'Sonic Lemon Fuel',type:'Sativa (per Spinach)',lineage:'Sour Diesel × Sage',breeder:'Sold under the Spinach brand',flower:'Not published',thc:'210–310 mg/g flower',terps:['Limonene','Humulene','Myrcene'],
  grow:['The producer publishes no grow notes'],
  watch:[],
  src:[['Spinach: Sonic Lemon Fuel','https://spinachcannabis.com/strains/sonic-lemon-fuel/']]},
 {k:'atomic-sour-grapefruit',n:'Atomic Sour Grapefruit',type:'Indica per Spinach; hybrid per MedBud',lineage:'Chemdawg × SFV OG Kush',breeder:'Sold under the Spinach brand',flower:'Not published',thc:'220–280 mg/g flower',terps:['Limonene','Linalool','Terpineol'],
  grow:['The producer publishes no grow notes'],
  watch:[],
  src:[['Spinach: Atomic Sour Grapefruit','https://spinachcannabis.com/strains/atomic-sour-grapefruit/'],['MedBud: Atomic Sour Grapefruit','https://medbud.wiki/cultivars/atomic-sour-grapefruit/']]},
 {k:'critical-kush',n:'Critical Kush',type:'Indica',lineage:'Critical Mass × OG Kush',breeder:'Barney’s Farm',flower:'50–60 days indoors',thc:'About 18% (listing)',terps:['Myrcene','Caryophyllene','Limonene'],
  grow:['Moderate difficulty','Very resinous; strong smell during drying'],
  watch:[{i:'bot',t:'From parent Critical Mass: extremely dense buds prone to botrytis, and colas heavy enough to break branches. Inherited risk, not confirmed for this cross.'},{i:'pm',t:'From parent OG Kush: listed as powdery mildew susceptible. Inherited risk, not confirmed for this cross.'}],
  src:[['Leafly: Critical Kush','https://www.leafly.com/strains/critical-kush'],['Prime Cuts Nursery: Critical Mass','https://www.primecutsnursery.com/strains/critical-mass']]}
];
function strainOf(k){return STRAINS.find(s=>s.k===k)||null}
function itemName(k){const i=PLANT_ITEMS.find(x=>x.k===k);return i?i.n:k}
function strainSelect(id,sel,attrs){return '<select id="'+id+'" '+(attrs||'')+'><option value="">Not set</option>'+STRAINS.map(s=>'<option value="'+s.k+'"'+(s.k===sel?' selected':'')+'>'+esc(s.n)+'</option>').join('')+'</select>'}
function zonesFor(k){return ZONES.filter(z=>zoneMap[z]===k)}
function strainCardText(s){
  let t=s.n+(s.aka?' ('+s.aka+')':'')+'\nType: '+s.type+'\nLineage: '+s.lineage+'\nBreeder: '+s.breeder+'\nFlowering: '+s.flower+'\nTHC: '+s.thc+'\nTerpenes: '+s.terps.join(', ');
  if(s.grow.length)t+='\nGrow notes: '+s.grow.join('; ');
  if(s.watch.length)t+='\nScouting watch-outs: '+s.watch.map(w=>itemName(w.i)+': '+w.t).join(' ');
  const n=(strainNotes[s.k]||'').trim();if(n)t+='\nFacility notes: '+n;
  const zs=zonesFor(s.k);if(zs.length)t+='\nGrowing in: zones '+zs.join(', ');
  t+='\nSources: '+s.src.map(x=>x[1]).join(' ');
  return t;
}
const STRAIN_HUES=['#8E6CCB','#3E8E4D','#E07AA0','#D99A28','#4A9CC0','#B06AAE','#6FA84F'];

let db=null, downloads=null, dbState='connecting';
let walks={};
let pending=new Set();
const timers={}, inflight={}, again={};
let firstServerSnap=true;
let strainNotes={}, zoneMap={}, sprays={}, products=[], plantings={};
const docPending={}, docVer={};
const state={view:'home',walkId:null,card:null,metric:'cardTotal',trendZone:null,confirmDel:false,startZone:ZONE_MIN,startDate:today()};

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function clone(o){return o===undefined?undefined:JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function key(h,c){return 'H'+h+'C'+c}

/* local mirror so work survives bad signal */
function loadLocal(){loadPrefs()}
function saveLocal(){prefs.lastZone=state.startZone;prefs.lastByArea=state.lastByArea||{};prefs.lastApplicator=state.lastApplicator||'';savePrefs()}

/* walk data helpers */
function getCard(w,k){if(!w.cards)w.cards={};if(!w.cards[k])w.cards[k]={c:{},ce:false,p:{}};return w.cards[k]}
function cardTotal(cd){return cd?CARD_ITEMS.reduce((s,i)=>s+(+cd.c?.[i.k]||0),0):0}
function plantDone(pl){return pl&&(pl.s==='clean'||pl.s==='issue')}
function plantMax(pl){if(!pl||pl.s!=='issue')return 0;return Math.max(0,...PLANT_ITEMS.map(i=>+pl.v?.[i.k]||0))}
function cardDone(cd,n){n=n||curPlants();if(!cd||!cd.ce)return false;for(let p=1;p<=n;p++)if(!plantDone(cd.p?.['P'+p]))return false;return true}
function walkProgress(w){let cards=0,plants=0;const n=plantsFor(w.zone);for(let h=1;h<=housesFor(w.zone);h++)for(let c=1;c<=CARDS;c++){const cd=w.cards?.[key(h,c)];if(cardDone(cd,n))cards++;for(let p=1;p<=n;p++)if(plantDone(cd?.p?.['P'+p]))plants++}return{cards,plants}}
function walkTotals(w){const t={};CARD_ITEMS.forEach(i=>t[i.k]=0);const inc={};PLANT_ITEMS.forEach(i=>inc[i.k]=0);let findings=0;
  Object.values(w.cards||{}).forEach(cd=>{CARD_ITEMS.forEach(i=>t[i.k]+=(+cd.c?.[i.k]||0));Object.values(cd.p||{}).forEach(pl=>{if(pl.s==='issue'){let any=false;PLANT_ITEMS.forEach(i=>{if((+pl.v?.[i.k]||0)>0){inc[i.k]++;any=true}});if(any)findings++}})});
  return{t,inc,findings,catches:Object.values(t).reduce((a,b)=>a+b,0)}}

/* saving */
function touch(id){if(walks[id])walks[id].updatedAt=Date.now();pending.add(id);saveLocal();clearTimeout(timers[id]);timers[id]=setTimeout(()=>push(id),250);updateSync()}
async function push(id){
  if(!db){updateSync();return}
  if(inflight[id]){again[id]=true;return}
  inflight[id]=true;updateSync();
  const body=clone(walks[id]);
  try{
    const ref=db.doc('walks/'+id);
    if(body===undefined)await ref.delete();else await ref.set(body);
    if(JSON.stringify(walks[id])===JSON.stringify(body))pending.delete(id);
    saveLocal();
  }catch(e){
    if(e&&e.code==='quota_exceeded')toast('Storage is full. Delete old walks to save new ones.');
    else if(e&&e.code==='invalid_argument')toast('You can view these records but not change them.');
    else setTimeout(()=>push(id),8000+Math.random()*4000);
  }finally{
    inflight[id]=false;
    if(again[id]){again[id]=false;push(id)}
    updateSync();
  }
}
function flushPending(){[...pending].forEach(id=>push(id));Object.keys(docPending).forEach(p=>pushDoc(p))}
function saveDoc(path){docPending[path]=true;docVer[path]=(docVer[path]||0)+1;saveLocal();clearTimeout(timers[path]);timers[path]=setTimeout(()=>pushDoc(path),250);updateSync()}
function docBody(path){if(path.startsWith('plantings/')){const x=plantings[path.slice(10)];return x?clone(x):null}if(path==='config/products')return{list:products,updatedAt:Date.now()};if(path.startsWith('sprays/')){const x=sprays[path.slice(7)];return x?clone(x):null}if(path==='config/zones')return{map:zoneMap,updatedAt:Date.now()};return{notes:strainNotes[path.split('/')[1]]||'',updatedAt:Date.now()}}
async function pushDoc(path){
  if(!db){updateSync();return}
  if(inflight[path]){again[path]=true;return}
  inflight[path]=true;const v=docVer[path];
  try{const body=docBody(path);if(body===null)await db.doc(path).delete();else await db.doc(path).set(body);if(docVer[path]===v){delete docPending[path];if(body===null&&path.startsWith('sprays/'))delete sprays[path.slice(7)];if(body===null&&path.startsWith('plantings/'))delete plantings[path.slice(10)];saveLocal()}}
  catch(e){if(e&&e.code==='invalid_argument')toast('You can view these notes but not change them.');else if(e&&e.code==='quota_exceeded')toast('Storage is full.');else setTimeout(()=>pushDoc(path),8000+Math.random()*4000)}
  finally{inflight[path]=false;if(again[path]){again[path]=false;pushDoc(path)}updateSync()}
}

function updateSync(){const el=document.getElementById('sync');if(!el)return;let cls,txt;if(!db){cls=dbState==='error'?'err':'busy';txt=dbState==='error'?'Not saving':'Opening'}else if(pending.size||Object.keys(docPending).length){cls='busy';txt='Saving'}else{cls='ok';txt='Saved on phone'}el.className='sync '+cls;el.innerHTML='<b></b>'+txt}

let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* level mapping for heat grid */
const METRICS=[{k:'cardTotal',n:'All card catches'},...CARD_ITEMS.map(i=>({k:'card:'+i.k,n:'Card · '+i.n})),{k:'plantsHit',n:'Plants with findings'},...PLANT_ITEMS.map(i=>({k:'plant:'+i.k,n:'Plant · '+i.n}))];
function binCount(v,b){if(v<=0)return 0;if(v<=b[0])return 1;if(v<=b[1])return 2;if(v<=b[2])return 3;return 4}
function cellMetric(cd,m,n){n=n||5;
  if(m==='cardTotal'){const v=cardTotal(cd);return{v,l:binCount(v,[5,15,40]),legend:['0','1–5','6–15','16–40','41+']}}
  if(m.startsWith('card:')){const v=+cd?.c?.[m.slice(5)]||0;return{v,l:binCount(v,[2,8,20]),legend:['0','1–2','3–8','9–20','21+']}}
  if(m==='plantsHit'){let v=0;for(let p=1;p<=n;p++)if(plantMax(cd?.p?.['P'+p])>0)v++;const t=[Math.ceil(n*.2),Math.ceil(n*.4),Math.ceil(n*.6)];const r=(a,b)=>a===b?String(a):a+'–'+b;return{v,l:binCount(v,t),legend:['0',r(1,t[0]),r(t[0]+1,t[1]),r(t[1]+1,t[2]),r(t[2]+1,n)]}}
  const k=m.slice(6);let v=0;for(let p=1;p<=n;p++){const pl=cd?.p?.['P'+p];if(pl&&pl.s==='issue')v=Math.max(v,+pl.v?.[k]||0)}
  return{v,l:v,legend:SEV,sev:true};
}

    if(s==='issue'){PLANT_GROUPS.forEach(g=>{h+='<div class="grp">'+esc(g.label)+'</div>';g.items.forEach(i=>{const v=+pl.v?.[i.k]||0;h+='<div class="item"><div class="nm">'+esc(i.n)+infoBtn('plant',i.k)+'</div><div class="seg" role="group" aria-label="'+esc(i.n)+' severity">'+SEV.map((sn,si)=>'<button class="s'+si+(v===si?' sel':'')+'" data-act="sev" data-k="'+pk+'" data-i="'+i.k+'" data-v="'+si+'" aria-pressed="'+(v===si)+'"><span class="k">'+si+'</span>'+sn+'</button>').join('')+'</div></div>'})});

function nextCardKey(k){const [h,c]=k.match(/\d+/g).map(Number);if(c<CARDS)return key(h,c+1);if(h<curHouses())return key(h+1,1);return null}

function sparkSvg(vals){if(!vals.length)return'';const W=160,H=44,pad=4;const mx=Math.max(1,...vals);const n=vals.length;
  const x=i=>n===1?W/2:pad+(W-2*pad)*i/(n-1),y=v=>H-pad-(H-2*pad)*v/mx;
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  const area='M'+x(0).toFixed(1)+','+(H-pad)+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+(H-pad)+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="'+(H-pad)+'" x2="'+W+'" y2="'+(H-pad)+'" stroke="var(--line)" stroke-width="1"/><path d="'+area+'" fill="var(--h1)" opacity=".7"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--h3)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="'+x(n-1).toFixed(1)+'" cy="'+y(vals[n-1]).toFixed(1)+'" r="3" fill="var(--h4)"/></svg>'}

function viewTrends(){

  h+='<h2>Plants affected per walk</h2><div class="sparks">'+PLANT_ITEMS.map(i=>{const vals=tots.map(t=>t.inc[i.k]);return '<div class="spark"><div class="t">'+esc(i.n)+'<span>'+(vals.at(-1)??0)+'</span></div>'+sparkSvg(vals)+'</div>'}).join('')+'</div>';
  {const zs=sprayEntries().filter(([,x])=>x.zones.includes(state.trendZone)).sort((a,b)=>b[1].date.localeCompare(a[1].date));const now=Date.now();
  h+='<h2>Sprays in Zone '+state.trendZone+'</h2>'+(zs.length?'<div class="list">'+zs.slice(0,10).map(([id,x])=>{const r=reentryAt(x);return sprayRow(id,x,!!(r&&r.getTime()>now))}).join('')+'</div>':'<p class="note">No sprays logged for this zone.</p>')}
  h+='<h2>By walk</h2><div class="tbl-wrap"><table><thead><tr><th>Date</th>'+CARD_ITEMS.map(i=>'<th>'+esc(i.n.split(' ')[0])+'</th>').join('')+'<th>Flagged</th></tr></thead><tbody>'+ws.slice().reverse().map(([id,w])=>{const t=walkTotals(w);return '<tr><td>'+esc(w.date)+'</td>'+CARD_ITEMS.map(i=>'<td>'+t.t[i.k]+'</td>').join('')+'<td>'+t.findings+'</td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div style="margin-top:14px"><button class="btn block" data-act="exportzone">Export all Zone '+state.trendZone+' walks as CSV</button></div>';
  return h;
}

function targetName(k){return k==='preventive'?'Preventive':((guideOf(k)||{}).n||k)}
function pad2(n){return String(n).padStart(2,'0')}
function isoDay(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function isoLocal(d){return isoDay(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function fmtShort(iso){const [y,m,dd]=iso.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function fmtWhen(d){const t=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return isoDay(d)===today()?t:d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', '+t}
function fmtLeft(d){const m=Math.max(1,Math.round((d-Date.now())/60000));if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h '+(m%60)+' min';return Math.floor(h/24)+' d '+(h%24)+' h'}
function sprayStart(s){const [y,m,d]=(s.date||today()).split('-').map(Number);const [hh,mm]=(s.time||'00:00').split(':').map(Number);return new Date(y,m-1,d,hh||0,mm||0)}
function reentryAt(s){const h=parseFloat(s.rei);return h>0?new Date(sprayStart(s).getTime()+h*3600000):null}
function phiUntil(s){const d=parseFloat(s.phi);if(!(d>0))return null;const t=sprayStart(s);t.setHours(0,0,0,0);t.setDate(t.getDate()+Math.ceil(d));return t}
function sprayEntries(){return Object.entries(sprays).filter(([,s])=>s&&s.product)}
function activeREIs(){const now=Date.now();return sprayEntries().map(([id,s])=>({id,s,until:reentryAt(s)})).filter(x=>x.until&&x.until.getTime()>now).sort((a,b)=>a.until-b.until)}
function zoneREI(z){return activeREIs().filter(x=>x.s.zones.includes(+z))}
function lastSprayInZone(z,onOrBefore){return sprayEntries().filter(([,s])=>s.zones.includes(+z)&&(!onOrBefore||s.date<=onOrBefore)).sort((a,b)=>(b[1].date+(b[1].time||'')).localeCompare(a[1].date+(a[1].time||'')))[0]||null}
function spraysForPest(k){return sprayEntries().filter(([,s])=>(s.targets||[]).includes(k)).sort((a,b)=>b[1].date.localeCompare(a[1].date))}
function daysBefore(date,ref){const a=new Date(date+'T00:00'),b=new Date(ref+'T00:00');const n=Math.round((b-a)/864e5);return n<=0?'same day as this walk':n===1?'1 day before this walk':n+' days before this walk'}
function calcText(d){const r=reentryAt(d),p=phiUntil(d);return (r?'Re-entry after <b>'+esc(fmtWhen(r))+'</b>':'No REI entered')+'<br>'+(p?'Harvest not before <b>'+esc(p.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</b>':'No PHI entered')}

function sprayCsv(list){const rows=[['date','start_time','area','zones','houses','product','pcp_number','active_ingredient','targets','method','rate','total_volume_L','rei_hours','reentry_after','phi_days','harvest_not_before','applied_by','lot_batch','temp_C','rh_pct','result','notes']];
  list.forEach(([,s])=>{const r=reentryAt(s),p=phiUntil(s);rows.push([s.date,s.time||'',[...new Set(s.zones.map(z=>areaOf(z).n))].join('; '),s.zones.join('; '),s.houses&&s.houses.length?s.houses.map(x=>'H'+x).join('; '):'All',s.product.name,s.product.pcp,s.product.active,(s.targets||[]).map(targetName).join('; '),s.method,s.rate,s.volume,s.rei,r?isoLocal(r):'',s.phi,p?isoDay(p):'',s.applicator,s.lot,s.temp,s.rh,(RESULTS.find(x=>x[0]===(s.result||''))||RESULTS[0])[1],s.notes])});

/* ---------- on-phone storage (IndexedDB) ---------- */
const IDB={h:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('zonescout',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.h=r.result;res()};r.onerror=()=>rej(r.error)})},
  run(mode,fn){return new Promise((res,rej)=>{const t=IDB.h.transaction('kv',mode);const st=t.objectStore('kv');const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(k,v){return IDB.run('readwrite',s=>s.put(v,k))},
  del(k){return IDB.run('readwrite',s=>s.delete(k))},
  get(k){return IDB.run('readonly',s=>s.get(k))},
  all(){return new Promise((res,rej)=>{const out={};const t=IDB.h.transaction('kv','readonly');const c=t.objectStore('kv').openCursor();c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  clearData(){return new Promise((res,rej)=>{const t=IDB.h.transaction('kv','readwrite');const s=t.objectStore('kv');const c=s.openCursor();c.onsuccess=()=>{const x=c.result;if(x){if(!String(x.key).startsWith('meta/'))x.delete();x.continue()}};t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};

function applyAll(all){walks={};sprays={};plantings={};strainNotes={};zoneMap={};products=[];
  Object.entries(all).forEach(([k,v])=>{if(k.startsWith('walks/'))walks[k.slice(6)]=v;else if(k.startsWith('sprays/'))sprays[k.slice(7)]=v;else if(k.startsWith('plantings/'))plantings[k.slice(10)]=v;else if(k.startsWith('strains/'))strainNotes[k.slice(8)]=(v&&v.notes)||'';else if(k==='config/zones')zoneMap=(v&&v.map)||{};else if(k==='config/products')products=(v&&v.list)||[]})}

/* file saving: share sheet on phones, download elsewhere */
const fileSaver={async save({filename,data,type}){
  const t=type||(filename.endsWith('.json')?'application/json':'text/csv');const blob=new Blob([data],{type:t});
  try{const f=new File([blob],filename,{type:t});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return{status:'saved'}}}
  catch(e){if(e&&e.name==='AbortError')throw{code:'declined'};}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};

async function doRestore(){const o=state.restore&&state.restore.o;if(!o)return;const d=o.data;

const END_LABEL={flower:'Harvested',veg:'Moved out',mother:'Retired'};
function plantEntries(){return Object.entries(plantings).filter(([,p])=>p&&p.cultivar)}
function dayDiff(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5)}
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number);return isoDay(new Date(y,m-1,d+n))}
function fmtDay(d){return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function activePlanting(z){return plantEntries().filter(([,p])=>!p.harvested&&p.zone===+z).sort((a,b)=>b[1].planted.localeCompare(a[1].planted))[0]||null}
function plantOn(z,day){return plantEntries().filter(([,p])=>p.zone===+z&&p.planted<=day&&(!p.harvested||p.harvested>=day)).sort((a,b)=>b[1].planted.localeCompare(a[1].planted))[0]||null}
function phiConflicts(z,day){const [y,m,d]=day.split('-').map(Number);const t=new Date(y,m-1,d);return sprayEntries().filter(([,s])=>s.zones.includes(+z)&&s.date<=day).map(([id,s])=>({id,s,until:phiUntil(s)})).filter(x=>x.until&&x.until>t).sort((a,b)=>b.until-a.until)}
function listedDays(s){if(!s)return 0;let m=s.flower.match(/(\d+)\s*[–-]\s*(\d+)\s*days/);if(m)return +m[2];m=s.flower.match(/(\d+)\s*[–-]\s*(\d+)\s*weeks/);if(m)return +m[2]*7;return 0}
function refreshZoneCultivar(z){const a=activePlanting(z);const cur=zoneMap[z]||'';
  if(a){if(cur!==a[1].cultivar){zoneMap[z]=a[1].cultivar;saveDoc('config/zones')}}

function pfInput(t,changed){const d=state.plantDraft;if(!d)return;const f=t.dataset.pf;let v=t.value;if(f==='zone')v=+v;d[f]=v;if(f==='zone')d.houses=d.houses.filter(x=>x<=housesFor(v));
  if(changed&&['zone','cultivar','harvested','flip','planted'].includes(f))render()}
function savePlant(){
  const d=state.plantDraft;if(!d)return;const miss=[];if(!d.cultivar)miss.push('a cultivar');if(!d.zone)miss.push('a zone');if(!d.planted)miss.push('the planted date');
  if(miss.length){toast('Add '+miss.join(', ')+' to save.');return}
  const isF=areaOf(d.zone).k==='flower';
  if(isF&&d.flip&&d.flip<d.planted){toast('The flip date is before the planted date.');return}
  if(d.harvested&&d.harvested<d.planted){toast('The '+END_LABEL[areaOf(d.zone).k].toLowerCase()+' date is before the planted date.');return}
  const id=state.plantId||('g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));const prev=plantings[id];const T=v=>String(v==null?'':v).trim();
  const rec={cultivar:d.cultivar,zone:+d.zone,houses:d.houses.slice().sort((a,b)=>a-b),lot:T(d.lot),planted:d.planted,flip:isF?T(d.flip):'',expected:isF?T(d.expected):'',harvested:T(d.harvested),yieldG:isF?T(d.yieldG):'',notes:String(d.notes||'').slice(0,2000),createdAt:(prev&&prev.createdAt)||Date.now(),updatedAt:Date.now()};
  plantings[id]=rec;saveDoc('plantings/'+id);refreshZoneCultivar(rec.zone);if(prev&&prev.zone!==rec.zone)refreshZoneCultivar(prev.zone);
  state.plantDraft=null;state.plantId=null;toast(prev?'Planting updated':'Planting logged');go('plantings');
}
async function exportPlantings(){
  if(!downloads){toast('File export is not available in this view.');return}
  const list=plantEntries().sort((a,b)=>a[1].planted.localeCompare(b[1].planted));
  const rows=[['cultivar','area','zone','houses','lot_batch','planted','flipped','expected_harvest','end_date','end_type','days_total','days_in_flower','weight_g','notes']];
  list.forEach(([,p])=>{const ar=areaOf(p.zone);rows.push([(strainOf(p.cultivar)||{n:p.cultivar}).n,ar.n,p.zone,p.houses&&p.houses.length?p.houses.map(x=>'H'+x).join('; '):'All',p.lot,p.planted,p.flip,p.expected,p.harvested,p.harvested?END_LABEL[ar.k]:'',p.harvested?dayDiff(p.planted,p.harvested):'',p.flip&&p.harvested?dayDiff(p.flip,p.harvested):'',p.yieldG,p.notes])});
  const csv=rows.map(r=>r.map(v=>{const x=String(v==null?'':v);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\n');const name='plantings_'+today()+'.csv';
  try{await downloads.save({filename:name,data:csv});toast('Exported '+name)}catch(e){if(e&&e.code==='declined')return;toast('Export failed. Try again in a moment.')}
}

/* CSV */
function csvRows(list){
  const rows=[['date','area','zone','cultivar','house','card','plant','source','item','value','note']];
  list.forEach(([,w])=>{const an=areaOf(w.zone).n;const cv=(strainOf(w.strain)||{}).n||'';for(let h=1;h<=housesFor(w.zone);h++)for(let c=1;c<=CARDS;c++){const cd=w.cards?.[key(h,c)];if(!cd)continue;
    if(cd.ce)CARD_ITEMS.forEach(i=>rows.push([w.date,an,w.zone,cv,h,c,'','sticky card',i.n,+cd.c?.[i.k]||0,'']));
    for(let p=1;p<=plantsFor(w.zone);p++){const pl=cd.p?.['P'+p];if(!plantDone(pl))continue;
      if(pl.s==='clean')rows.push([w.date,an,w.zone,cv,h,c,p,'plant','clean',0,'']);
      else{const hits=PLANT_ITEMS.filter(i=>(+pl.v?.[i.k]||0)>0);if(!hits.length)rows.push([w.date,an,w.zone,cv,h,c,p,'plant','clean',0,pl.n||'']);hits.forEach((i,ix)=>rows.push([w.date,an,w.zone,cv,h,c,p,'plant',i.n,+pl.v[i.k],ix===0?(pl.n||''):'']))}}}});
  return rows.map(r=>r.map(v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
}
async function exportCsv(list,name){
  if(!downloads){toast('File export is not available in this view.');return}
  try{await downloads.save({filename:name,data:csvRows(list)});toast('Exported '+name)}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('An export is already waiting for your answer.');return}toast('Export failed. Try again in a moment.')}
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf){pfInput(t,false);return}
  if(t.dataset.sf){sfInput(t);return}
  if(t.dataset.inp==='snote'){strainNotes[t.dataset.k]=t.value.slice(0,4000);saveDoc('strains/'+t.dataset.k);return}
  if(t.dataset.inp==='note'){const w=walks[state.walkId];const cd=getCard(w,state.card);const pl=cd.p[t.dataset.k];if(pl){pl.n=t.value.slice(0,500);touch(state.walkId)}}
});
window.addEventListener('online',()=>{flushPending();updateSync()});
window.addEventListener('offline',updateSync);

/* boot */
loadPrefs();render();
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='pin_in'&&e.key==='Enter')tryUnlock()});
function flushNow(){Object.keys(timers).forEach(k=>clearTimeout(timers[k]));flushPending()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushNow();hiddenAt=Date.now()}else if(pinRec&&!locked&&hiddenAt&&Date.now()-hiddenAt>60000)lockNow()});
window.addEventListener('pagehide',flushNow);
(async()=>{
  downloads=fileSaver;
  try{await IDB.open();applyAll(await IDB.all());pinRec=(await IDB.get('meta/pin'))||null;db=localDb;dbState='ready'}
  catch(e){dbState='error';toast('This phone blocked storage for Zone Scout, so entries can’t be saved. Private browsing must be off.')}
  if(pinRec)lockNow();
  render();
  try{if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persisted();if(!persisted)persisted=await navigator.storage.persist();if(state.view==='settings')render()}}catch(e){}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
setInterval(()=>{if(['home','sprays','walk'].includes(state.view))safeRender()},60000);
})();
</script>
</body>
</html>
